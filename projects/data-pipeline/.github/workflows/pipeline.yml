name: Daily Pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r projects/data-pipeline/requirements.txt
      - run: python projects/data-pipeline/run_pipeline.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily pipeline snapshot"
