name: CI

on:
  push:
    branches: [main]
    paths: ["projects/task-api/**"]
  pull_request:
    paths: ["projects/task-api/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/task-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/task-api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t task-api .
